<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#001f54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glowing Pulse Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(360px); }
      }
      .bg-pulse {
        animation: pulse 6s infinite ease-in-out;
        transform-origin: center;
      }
      .node-1 { animation: floatNode 4s infinite ease-in-out; }
      .node-2 { animation: floatNode 5s infinite ease-in-out 1s; }
      .node-3 { animation: floatNode 4.5s infinite ease-in-out 2s; }
      .scan-line {
        animation: scanline 8s infinite linear;
        opacity: 0.15;
      }
      .banner-title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 48px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .banner-subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 21px;
        fill: #00f2fe;
      }
      .banner-tag {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #e0f2fe;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Grid Pattern -->
  <g class="bg-pulse" opacity="0.25">
    <circle cx="150" cy="80" r="140" fill="#00f2fe" filter="url(#glow)" opacity="0.15" />
    <circle cx="1050" cy="280" r="160" fill="#4facfe" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Animated Scan Line -->
  <line class="scan-line" x1="0" y1="0" x2="1200" y2="0" stroke="#00f2fe" stroke-width="4" filter="url(#glow)" />

  <!-- Dynamic Background Nodes (Medical Imaging Grid Graphics) -->
  <g filter="url(#glow)">
    <!-- Connected Crosshair & DICOM Nodes -->
    <g class="node-1">
      <circle cx="1000" cy="110" r="36" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6" />
      <circle cx="1000" cy="110" r="8" fill="#00f2fe" opacity="0.8" />
      <line x1="940" y1="110" x2="1060" y2="110" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
      <line x1="1000" y1="50" x2="1000" y2="170" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
    </g>

    <g class="node-2">
      <rect x="840" y="200" width="70" height="70" rx="12" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.5" />
      <path d="M 855 235 L 895 235 M 875 215 L 875 255" stroke="#4facfe" stroke-width="2" opacity="0.7" />
    </g>

    <g class="node-3">
      <circle cx="1100" cy="230" r="24" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.5" />
      <circle cx="1100" cy="230" r="4" fill="#00f2fe" opacity="0.9" />
    </g>

    <!-- Connecting Mesh Lines -->
    <path d="M 1000 110 L 875 200 L 1100 230" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,3" opacity="0.3" fill="none" />
  </g>

  <!-- Foreground Content Container (Ensures Title & Subtitle sit clearly above backdrop) -->
  <g transform="translate(70, 0)">
    <!-- Category Badge Pills -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="#001233" stroke="#00f2fe" stroke-width="1.5" />
    <text x="115" y="76" class="banner-tag" text-anchor="middle">🏥 Healthcare &amp; IT Ecosystem</text>

    <!-- Main Title -->
    <text x="0" y="145" class="banner-title">Awesome DICOM Viewer Cloud</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="banner-subtitle">Curated Medical Imaging SaaS Platforms &amp; Open-Source PACS Ecosystem</text>

    <!-- Feature Pill Tags -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <text x="85" y="23" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">☁️ Cloud PACS</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="200" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <text x="285" y="23" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">⚡ Zero-Footprint HTML5</text>

      <!-- Pill 3 -->
      <rect x="400" y="0" width="190" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <text x="495" y="23" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">🔬 Open-Source DICOM</text>
    </g>
  </g>
</svg>
